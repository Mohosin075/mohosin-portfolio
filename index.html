<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f8f7f4" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('portfolio-theme'); } catch {}
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === 'dark' ? '#101722' : '#f8f7f4';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preload" as="image" type="image/webp"
      href="/src/assets/portrait/mohosin-640.webp"
      imagesrcset="/src/assets/portrait/mohosin-320.webp 320w, /src/assets/portrait/mohosin-640.webp 640w, /src/assets/portrait/mohosin-960.webp 960w"
      imagesizes="(min-width: 1100px) 380px, (min-width: 800px) 320px, (min-width: 640px) 360px, 280px" fetchpriority="high" />

    <!-- Primary Meta -->
    <title>Md Mohosin Ali | Full Stack Developer</title>
    <meta name="description" content="Full Stack Developer building React and Next.js applications, TypeScript APIs, database systems and AI integrations. From architecture to cloud deployment at Sparktech Agency." />
    <meta name="keywords" content="Md Mohosin Ali, Full Stack Developer, Backend Developer, MERN Stack, Node.js, Express.js, TypeScript, MongoDB, React, REST API, Sparktech Agency, Bangladesh Developer" />
    <meta name="author" content="Md Mohosin Ali" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mohosin-portfolio.vercel.app/" />
    <meta property="og:title" content="Md Mohosin Ali | Full Stack Developer" />
    <meta property="og:description" content="Full-stack web applications, backend APIs, AI integrations and cloud deployment. Explore projects by Md Mohosin Ali." />
    <meta property="og:image" content="https://mohosin-portfolio.vercel.app/mohosin-social.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Md Mohosin Ali | Full Stack Developer" />
    <meta name="twitter:description" content="Full Stack Developer working with React, Next.js, Node.js, TypeScript, databases and AWS. Backend Developer at Sparktech Agency." />
    <meta name="twitter:image" content="https://mohosin-portfolio.vercel.app/mohosin-social.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
